<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>StarGaze</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main>
    <h1>StarGaze</h1>
    <p class="subtitle">Find the best stargazing conditions near you.</p>

    <div class="search-row">
      <input id="city-input" type="text" placeholder="Enter a city, e.g. Cape Town" autocomplete="off" aria-label="City" />
      <button id="search-btn">Search</button>
    </div>

    <div id="message" role="status" aria-live="polite"></div>

    <section id="results" aria-labelledby="location-name">
      <div class="location-title" id="location-name"></div>
      <div class="spot-name" id="spot-name"></div>
      <div class="spot-coords" id="spot-coords"></div>
      <div class="timestamp" id="timestamp"></div>

      <iframe class="map-frame" id="map-frame" title="Map of the best spot" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      <a class="earth-link" id="earth-link" target="_blank" rel="noopener">Open exact spot in Google Earth ↗</a>

      <table>
        <thead>
          <tr><th>Condition</th><th>Value</th><th>Rating</th></tr>
        </thead>
        <tbody id="conditions-body"></tbody>
      </table>

      <div class="night-forecast-title">Astronomically dark hours at this spot</div>
      <div id="night-forecast"></div>
    </section>
  </main>

  <script src="starfield.js"></script>
  <script src="time-format.js"></script>
  <script src="app.js"></script>
</body>
</html>
